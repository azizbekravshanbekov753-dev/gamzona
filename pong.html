<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Pong</title>
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}
    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
    .mode-btns{display:flex;gap:8px;margin-bottom:16px;}
    .mode-btn{padding:9px 20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:rgba(255,255,255,.6);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
    .mode-btn.active{background:rgba(245,158,11,.2);border-color:#f59e0b;color:#fff;}
    canvas{border:2px solid rgba(245,158,11,.3);border-radius:12px;background:#000;box-shadow:0 0 40px rgba(245,158,11,.1);}
    .hint{color:rgba(255,255,255,.3);font-size:12px;margin-top:10px;text-align:center;}
    .controls{display:flex;gap:10px;margin-top:14px;}
    .ctrl-btn{padding:10px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .btn-play{background:linear-gradient(135deg,#f59e0b,#f97316);}
    .btn-play:hover{transform:translateY(-2px);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    /* Mobile controls */
    .mobile-ctrl{display:none;gap:20px;margin-top:14px;}
    .paddle-btns{display:flex;flex-direction:column;gap:6px;align-items:center;}
    .pd-btn{width:56px;height:56px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);border-radius:12px;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .pd-btn:active{background:rgba(245,158,11,.35);}
    @media(max-width:600px){.mobile-ctrl{display:flex;}canvas{width:min(380px,95vw);height:auto;}}
    .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;}
    .result-overlay.show{display:flex;}
    .result-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .res-emoji{font-size:64px;display:block;margin-bottom:12px;}
    .res-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
    .res-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:20px;}
    .res-coins{color:#fbbf24;font-size:16px;font-weight:700;margin-bottom:20px;}
    .res-btns{display:flex;gap:10px;justify-content:center;}
    .res-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
    .res-play{background:linear-gradient(135deg,#f59e0b,#f97316);}
    .res-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  </style>
</head>
<body>
<nav class="navbar">
  <button class="back-btn" onclick="goHome()">← Orqaga</button>
  <div class="nav-logo">🏓 Pong</div>
  <div class="coin-display">🪙 <span id="nav-coins">0</span></div>
</nav>
<div class="game-wrap">
  <h1 class="game-title">PONG</h1>
  <div class="mode-btns">
    <button class="mode-btn active" id="mode-1p" onclick="setMode('1p',this)">🤖 CPU ga qarshi</button>
    <button class="mode-btn" id="mode-2p" onclick="setMode('2p',this)">👥 2 kishi (bir klaviatura)</button>
  </div>
  <canvas id="canvas" width="600" height="400"></canvas>
  <div class="hint" id="hint">SPACE bosib boshlang | W/S — Chap | ↑/↓ — O'ng</div>
  <div class="controls">
    <button class="ctrl-btn btn-play" onclick="startGame()">▶ Boshlash</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">🏠 Uy</button>
  </div>
  <div class="mobile-ctrl">
    <div class="paddle-btns">
      <div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:4px">Chap</div>
      <button class="pd-btn" id="l-up">▲</button>
      <button class="pd-btn" id="l-dn">▼</button>
    </div>
    <div class="paddle-btns">
      <div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:4px">O'ng</div>
      <button class="pd-btn" id="r-up">▲</button>
      <button class="pd-btn" id="r-dn">▼</button>
    </div>
  </div>
</div>
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="res-emoji" id="res-emoji">🏆</span>
    <div class="res-title" id="res-title"></div>
    <div class="res-sub"   id="res-sub"></div>
    <div class="res-coins" id="res-coins"></div>
    <div class="res-btns">
      <button class="res-btn res-play" onclick="startGame()">🔄 Qayta</button>
      <button class="res-btn res-home" onclick="goHome()">🏠 Uy</button>
    </div>
  </div>
</div>
<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
const W=600,H=400,PAD_W=12,PAD_H=80,BALL_R=8,WIN_SCORE=7;
let mode='1p', running=false, animId;
let ball,lPad,rPad,lScore,rScore,keys={};

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  drawIdle();
  document.addEventListener('keydown',e=>{keys[e.key]=true; if(e.key===' '){e.preventDefault();if(!running)startGame();}});
  document.addEventListener('keyup', e=>{keys[e.key]=false;});
  // Mobile buttons
  const held={};
  ['l-up','l-dn','r-up','r-dn'].forEach(id=>{
    const btn=document.getElementById(id);
    btn.addEventListener('touchstart',()=>{held[id]=true;},{passive:true});
    btn.addEventListener('touchend',()=>{held[id]=false;});
    btn.addEventListener('mousedown',()=>held[id]=true);
    btn.addEventListener('mouseup',()=>held[id]=false);
  });
  window._mobileHeld=held;
});

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('hint').textContent=m==='1p'?'SPACE bosib boshlang | W/S — Chap raketa':'SPACE bosib boshlang | W/S — Chap | ↑/↓ — O\'ng';
}

function initState(){
  ball={x:W/2,y:H/2,vx:(Math.random()>.5?1:-1)*4,vy:(Math.random()>.5?1:-1)*3};
  lPad={y:H/2-PAD_H/2,vy:0};
  rPad={y:H/2-PAD_H/2,vy:0};
  lScore=0; rScore=0;
}

function startGame(){
  if(animId) cancelAnimationFrame(animId);
  initState(); running=true;
  document.getElementById('result-overlay').classList.remove('show');
  loop();
}

function loop(){
  update(); draw();
  if(running) animId=requestAnimationFrame(loop);
}

function update(){
  const SPEED=5;
  const held=window._mobileHeld||{};
  // Left paddle
  if(keys['w']||keys['W']||held['l-up']) lPad.y-=SPEED;
  if(keys['s']||keys['S']||held['l-dn']) lPad.y+=SPEED;
  lPad.y=Math.max(0,Math.min(H-PAD_H,lPad.y));
  // Right paddle
  if(mode==='2p'){
    if(keys['ArrowUp']||held['r-up']) rPad.y-=SPEED;
    if(keys['ArrowDown']||held['r-dn']) rPad.y+=SPEED;
  } else {
    // CPU AI
    const center=rPad.y+PAD_H/2;
    if(center<ball.y-10) rPad.y+=Math.min(SPEED*0.85,ball.y-center);
    else if(center>ball.y+10) rPad.y-=Math.min(SPEED*0.85,center-ball.y);
  }
  rPad.y=Math.max(0,Math.min(H-PAD_H,rPad.y));

  // Ball movement
  ball.x+=ball.vx; ball.y+=ball.vy;
  // Top/bottom bounce
  if(ball.y<=BALL_R){ball.y=BALL_R;ball.vy*=-1;}
  if(ball.y>=H-BALL_R){ball.y=H-BALL_R;ball.vy*=-1;}
  // Left paddle collision
  if(ball.x-BALL_R<=PAD_W+10&&ball.y>=lPad.y&&ball.y<=lPad.y+PAD_H&&ball.vx<0){
    ball.vx*=-1.05; ball.vy+=(ball.y-(lPad.y+PAD_H/2))*0.1;
    ball.x=PAD_W+10+BALL_R;
  }
  // Right paddle collision
  if(ball.x+BALL_R>=W-PAD_W-10&&ball.y>=rPad.y&&ball.y<=rPad.y+PAD_H&&ball.vx>0){
    ball.vx*=-1.05; ball.vy+=(ball.y-(rPad.y+PAD_H/2))*0.1;
    ball.x=W-PAD_W-10-BALL_R;
  }
  // Speed cap
  ball.vx=Math.max(-12,Math.min(12,ball.vx));
  ball.vy=Math.max(-10,Math.min(10,ball.vy));
  // Score
  if(ball.x<0){rScore++;resetBall(-1);}
  if(ball.x>W){lScore++;resetBall(1);}
  if(lScore>=WIN_SCORE||rScore>=WIN_SCORE) endGame();
}

function resetBall(dir){
  ball={x:W/2,y:H/2,vx:dir*4,vy:(Math.random()>.5?1:-1)*3};
}

function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  // Center line
  ctx.setLineDash([10,10]); ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.setLineDash([]);
  // Scores
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.font='bold 36px Orbitron,monospace'; ctx.textAlign='center';
  ctx.fillText(lScore,W/4,50); ctx.fillText(rScore,W*3/4,50);
  // Paddles
  ctx.fillStyle='#f59e0b';
  roundRect(ctx,10,lPad.y,PAD_W,PAD_H,6);
  ctx.fillStyle='#6366f1';
  roundRect(ctx,W-PAD_W-10,rPad.y,PAD_W,PAD_H,6);
  // Ball
  ctx.fillStyle='#fff';
  ctx.shadowColor='#fff'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}

function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.roundRect(x,y,w,h,r); c.fill();
}

function drawIdle(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(245,158,11,.4)';
  ctx.font='bold 16px Orbitron,monospace'; ctx.textAlign='center';
  ctx.fillText('SPACE yoki ▶ bosib boshlang',W/2,H/2);
}

function endGame(){
  running=false; cancelAnimationFrame(animId);
  const playerWon=(mode==='1p'&&lScore>=WIN_SCORE)||(mode==='2p'&&lScore>=WIN_SCORE);
  const pts=playerWon?75:0;
  if(pts>0){addCoins(pts);addResult(true);}else addResult(false);
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('res-emoji').textContent=playerWon?'🏆':'😢';
  document.getElementById('res-title').textContent=playerWon?'G\'OLIBSIZ!':'Yutqazdingiz';
  document.getElementById('res-sub').textContent=`${lScore} : ${rScore}`;
  document.getElementById('res-coins').textContent=pts>0?`+🪙 ${pts} tanga!`:'';
  document.getElementById('result-overlay').classList.add('show');
}
function goHome(){window.location.href='dashboard.html';}
</script>
</body>
</html>
