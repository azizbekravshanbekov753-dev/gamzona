<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Tosh Qaychi Qog'oz</title>
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}
    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;text-align:center;}
    /* Score */
    .score-bar{display:flex;align-items:center;gap:20px;margin-bottom:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 28px;}
    .sc-card{text-align:center;flex:1;}
    .sc-name{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:4px;}
    .sc-pts{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;}
    .sc-div{font-family:'Orbitron',sans-serif;font-size:14px;color:rgba(255,255,255,.2);}
    /* Arena */
    .arena{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:24px;min-height:140px;}
    .choice-display{width:110px;height:110px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:56px;transition:all .3s;}
    .choice-display.win{border-color:#10b981;background:rgba(16,185,129,.15);box-shadow:0 0 24px rgba(16,185,129,.3);}
    .choice-display.lose{border-color:#ef4444;background:rgba(239,68,68,.1);}
    .choice-display.draw{border-color:#f59e0b;background:rgba(245,158,11,.1);}
    .vs-txt{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:rgba(255,255,255,.3);}
    /* Result text */
    .round-result{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;text-align:center;min-height:32px;margin-bottom:20px;}
    /* Choices */
    .choices{display:flex;gap:14px;margin-bottom:24px;}
    .choice-btn{width:90px;height:90px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:18px;font-size:42px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;}
    .choice-btn:hover{transform:translateY(-6px) scale(1.1);background:rgba(99,102,241,.2);border-color:#6366f1;box-shadow:0 12px 32px rgba(99,102,241,.3);}
    .choice-btn:active{transform:scale(.95);}
    /* Round info */
    .round-info{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:12px;}
    /* Mode */
    .mode-btns{display:flex;gap:8px;margin-bottom:18px;}
    .mode-btn{padding:8px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:rgba(255,255,255,.6);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
    .mode-btn.active{background:rgba(99,102,241,.2);border-color:#6366f1;color:#fff;}
    .controls{display:flex;gap:10px;}
    .ctrl-btn{padding:10px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .btn-play{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;}
    .result-overlay.show{display:flex;}
    .result-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .res-emoji{font-size:64px;display:block;margin-bottom:12px;}
    .res-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
    .res-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:20px;}
    .res-coins{color:#fbbf24;font-size:16px;font-weight:700;margin-bottom:20px;}
    .res-btns{display:flex;gap:10px;justify-content:center;}
    .res-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
    .res-play{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
    .res-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  </style>
</head>
<body>
<nav class="navbar">
  <button class="back-btn" onclick="goHome()">← Orqaga</button>
  <div class="nav-logo">✊ Tosh Qaychi Qog'oz</div>
  <div class="coin-display">🪙 <span id="nav-coins">0</span></div>
</nav>
<div class="game-wrap">
  <h1 class="game-title">TOSH QAYCHI QOG'OZ</h1>
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('cpu',this)">🤖 CPU ga qarshi</button>
    <button class="mode-btn" onclick="setMode('2p',this)">👥 2 kishi</button>
  </div>
  <div class="score-bar">
    <div class="sc-card"><div class="sc-name" id="p1-name">Siz</div><div class="sc-pts" id="p1-score">0</div></div>
    <div class="sc-div">VS</div>
    <div class="sc-card"><div class="sc-name" id="p2-name">CPU</div><div class="sc-pts" id="p2-score">0</div></div>
  </div>
  <div class="round-info" id="round-info">Raund 1 / 5 — Tanlov qiling!</div>
  <div class="arena">
    <div class="choice-display" id="p1-choice">❓</div>
    <div class="vs-txt">VS</div>
    <div class="choice-display" id="p2-choice">❓</div>
  </div>
  <div class="round-result" id="round-result"></div>
  <!-- 2P turn indicator -->
  <div id="turn-indicator" style="display:none;font-size:14px;color:#a78bfa;margin-bottom:10px;text-align:center;font-weight:700;"></div>
  <div class="choices" id="choices">
    <button class="choice-btn" onclick="pick('✊')">✊</button>
    <button class="choice-btn" onclick="pick('✌️')">✌️</button>
    <button class="choice-btn" onclick="pick('🖐️')">🖐️</button>
  </div>
  <div class="controls">
    <button class="ctrl-btn btn-play" onclick="startGame()">🔄 Yangi O'yin</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">🏠 Uy</button>
  </div>
</div>
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="res-emoji" id="res-emoji">🏆</span>
    <div class="res-title" id="res-title"></div>
    <div class="res-sub"   id="res-sub"></div>
    <div class="res-coins" id="res-coins"></div>
    <div class="res-btns">
      <button class="res-btn res-play" onclick="startGame()">🔄 Qayta</button>
      <button class="res-btn res-home" onclick="goHome()">🏠 Uy</button>
    </div>
  </div>
</div>
<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
const CHOICES=['✊','✌️','🖐️'];
// ✊ beats ✌️, ✌️ beats 🖐️, 🖐️ beats ✊
const BEATS={
  '✊':{'✌️':true,'🖐️':false,'✊':null},
  '✌️':{'🖐️':true,'✊':false,'✌️':null},
  '🖐️':{'✊':true,'✌️':false,'🖐️':null},
};
const MAX_ROUNDS=5;
let mode='cpu', p1Score=0, p2Score=0, round=1, p1Pick=null, p2Pick=null, waiting2P=false;

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  startGame();
});

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('p2-name').textContent=m==='cpu'?'CPU':'O\'yinchi 2';
  startGame();
}

function startGame(){
  p1Score=0; p2Score=0; round=1; p1Pick=null; p2Pick=null; waiting2P=false;
  document.getElementById('p1-score').textContent='0';
  document.getElementById('p2-score').textContent='0';
  document.getElementById('p1-choice').textContent='❓';
  document.getElementById('p2-choice').textContent='❓';
  document.getElementById('p1-choice').className='choice-display';
  document.getElementById('p2-choice').className='choice-display';
  document.getElementById('round-result').textContent='';
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('choices').style.display='flex';
  updateRoundInfo();
  if(mode==='2p'){
    document.getElementById('turn-indicator').style.display='block';
    document.getElementById('turn-indicator').textContent='✊ O\'yinchi 1 navbati';
    document.getElementById('p1-name').textContent='O\'yinchi 1';
  } else {
    document.getElementById('turn-indicator').style.display='none';
    document.getElementById('p1-name').textContent=getCurrentUser()?.username||'Siz';
  }
}

function updateRoundInfo(){
  document.getElementById('round-info').textContent=`Raund ${round} / ${MAX_ROUNDS} — Tanlov qiling!`;
}

function pick(choice){
  if(mode==='cpu'){
    p1Pick=choice;
    const cpu=CHOICES[Math.floor(Math.random()*3)];
    playRound(choice,cpu);
  } else {
    // 2 player turn-based
    if(!waiting2P){
      p1Pick=choice;
      waiting2P=true;
      document.getElementById('p1-choice').textContent='🫱';
      document.getElementById('turn-indicator').textContent='✊ O\'yinchi 2 navbati';
    } else {
      p2Pick=choice;
      waiting2P=false;
      playRound(p1Pick,p2Pick);
    }
  }
}

function playRound(c1,c2){
  document.getElementById('choices').style.display='none';
  // Animate reveal
  let count=0;
  const emoji=['✊','✌️','🖐️'];
  const intv=setInterval(()=>{
    document.getElementById('p1-choice').textContent=emoji[count%3];
    document.getElementById('p2-choice').textContent=emoji[(count+1)%3];
    count++;
    if(count>6){clearInterval(intv);reveal(c1,c2);}
  },100);
}

function reveal(c1,c2){
  document.getElementById('p1-choice').textContent=c1;
  document.getElementById('p2-choice').textContent=c2;
  const result=BEATS[c1][c2];
  let msg='',cls1='',cls2='';
  const name1=mode==='cpu'?(getCurrentUser()?.username||'Siz'):'O\'yinchi 1';
  const name2=mode==='cpu'?'CPU':'O\'yinchi 2';
  if(result===null){msg='🤝 Durang!';cls1=cls2='draw';}
  else if(result){p1Score++;msg=`✅ ${name1} yutdi!`;cls1='win';cls2='lose';}
  else{p2Score++;msg=`✅ ${name2} yutdi!`;cls1='lose';cls2='win';}
  document.getElementById('p1-choice').className='choice-display '+cls1;
  document.getElementById('p2-choice').className='choice-display '+cls2;
  document.getElementById('p1-score').textContent=p1Score;
  document.getElementById('p2-score').textContent=p2Score;
  document.getElementById('round-result').textContent=msg;
  document.getElementById('round-result').style.color=result===null?'#f59e0b':result?'#10b981':'#ef4444';

  round++;
  if(round>MAX_ROUNDS||p1Score>MAX_ROUNDS/2||p2Score>MAX_ROUNDS/2){
    setTimeout(endGame,1000);
  } else {
    setTimeout(()=>{
      document.getElementById('p1-choice').textContent='❓';
      document.getElementById('p2-choice').textContent='❓';
      document.getElementById('p1-choice').className='choice-display';
      document.getElementById('p2-choice').className='choice-display';
      document.getElementById('round-result').textContent='';
      document.getElementById('choices').style.display='flex';
      p1Pick=null; p2Pick=null; waiting2P=false;
      updateRoundInfo();
      if(mode==='2p') document.getElementById('turn-indicator').textContent='✊ O\'yinchi 1 navbati';
    },1200);
  }
}

function endGame(){
  const myWin=p1Score>p2Score;
  const pts=myWin?60:0;
  if(pts>0){addCoins(pts);addResult(true);}else if(p1Score<p2Score)addResult(false);
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('res-emoji').textContent=myWin?'🏆':p1Score===p2Score?'🤝':'😢';
  document.getElementById('res-title').textContent=myWin?'G\'OLIBSIZ!':p1Score===p2Score?'Durang!':'Yutqazdingiz';
  document.getElementById('res-sub').textContent=`${p1Score} : ${p2Score}`;
  document.getElementById('res-coins').textContent=pts>0?`+🪙 ${pts} tanga!`:'';
  document.getElementById('result-overlay').classList.add('show');
}
function goHome(){window.location.href='dashboard.html';}
</script>
</body>
</html>
