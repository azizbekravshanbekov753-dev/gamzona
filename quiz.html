    .opponent-status{font-size:13px;color:rgba(255,255,255,.4);text-align:center;min-height:20px;margin-bottom:8px;}

</head>

  document.getElementById('sc2-name').textContent=p2User.username;
  document.getElementById('sc2-av').textContent=p2User.username.charAt(0).toUpperCase();
  document.getElementById('sc2-av').style.background=p2User.skinColor||'#f43f5e';
}

async function initMultiplayer(){
  if(!roomCode) return;
  const ably = getAbly();
  if(!ably){setConnBadge(false);return;}

  if(amIP1){
    document.getElementById('wait-overlay').style.display='flex';
    document.getElementById('wait-code').textContent=roomCode;
    _roomUnsub = hostRoom('quiz', roomCode, myKey, () => {
      document.getElementById('wait-overlay').style.display='none';
      showToast('рџЋ® Raqib ulandi!');
    });
  } else {
    document.getElementById('wait-overlay').style.display='none';
    _roomUnsub = guestJoinRoom('quiz', roomCode, myKey, () => {
      showToast('рџЋ® O\'yin boshlandi!');
    });
  }

  // Opponent answer sync
  const statUnsub = listenGameState('quiz', roomCode, (data) => {
    if(!data || gameOver) return;
    const myRole = amIP1?'p1':'p2';
    const oppRole = amIP1?'p2':'p1';
    if(data.qIndex===qIndex && data[oppRole+'Answered']!==undefined && oppAnswered===null){
      oppAnswered = data[oppRole+'Answered'];
      showOppFeedback(oppAnswered);
      const oppIdx = amIP1?1:0;
      scores[oppIdx] = data[oppRole+'Score']||0;
      document.getElementById(`sc${oppIdx+1}-pts`).textContent=scores[oppIdx];
      if(myAnswered!==null) advanceAfterBoth();
    }
  });
  const orig = _roomUnsub;
  _roomUnsub = () => { orig&&orig(); statUnsub&&statUnsub(); };
  setConnBadge(true);
}

function setConnBadge(online){
  const b=document.getElementById('conn-badge');
  b.className=`conn-badge ${online?'online':'offline'}`;
  document.getElementById('conn-text').textContent=online?'Ulangan':'Ulanmagan';
}

function restartGame(){
  const seed=Date.now();
  questions=[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,TOTAL_Q);
  qIndex=0; scores=[0,0]; activeTurn=0; myAnswered=null; oppAnswered=null;
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('sc1-pts').textContent='0';
  document.getElementById('sc2-pts').textContent='0';
  // If multiplayer host, push seed
  if(!isSolo&&amIP1){
    getDB()?.ref(`rooms/quiz/${roomCode}/state`).set({seed,qIndex:0,p1Score:0,p2Score:0});
  }
  showQuestion();
}

function showQuestion(){
  if(qIndex>=TOTAL_Q){endGame();return;}
  myAnswered=null; oppAnswered=null;
  clearInterval(timerInt);
  const q=questions[qIndex];

  document.getElementById('q-counter').textContent=`Savol ${qIndex+1} / ${TOTAL_Q}`;
  document.getElementById('prog-fill').style.width=`${(qIndex/TOTAL_Q)*100}%`;
  document.getElementById('q-turn').textContent=isSolo?`Navbat: ${activeTurn===0?p1User.username:p2User.username}`:'Ikkalasi javob beradi';
  document.getElementById('sc1').classList.toggle('active',true);
  document.getElementById('sc2').classList.toggle('active',true);
  document.getElementById('q-cat').textContent=q.cat;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('opp-status').textContent='';

  const wrap=document.getElementById('answers');
  wrap.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.textContent=opt;
    btn.onclick=()=>answer(i);
    wrap.appendChild(btn);
  });

  timeLeft=TIME; updateTimer(timeLeft,TIME);
  timerInt=setInterval(()=>{
    timeLeft--;
    updateTimer(timeLeft,TIME);
    if(timeLeft<=5){
      document.getElementById('timer-arc').style.stroke='#ef4444';
      document.getElementById('timer-text').style.color='#ef4444';
    }
    if(timeLeft<=0){clearInterval(timerInt);if(myAnswered===null)timeUp();}
  },1000);

  // CPU answer
  if(isSolo&&activeTurn===1){
    setTimeout(()=>{if(myAnswered===null)return;if(oppAnswered===null){const p=Math.random()<.7?q.ans:Math.floor(Math.random()*4);cpuAnswer(p);}},1500+Math.random()*3000);
  }
}

function answer(idx){
  if(myAnswered!==null) return;
  // In solo: only current player's turn
  if(isSolo){
    const myTurn=amIP1?0:1;
    if(activeTurn!==myTurn){showToast('вЏі Sizning navbatingiz emas!','error');return;}
  }
  myAnswered=idx;
  clearInterval(timerInt);

  const q=questions[qIndex];
  const btns=document.querySelectorAll('.ans-btn');
  const correct=idx===q.ans;
  const pts=correct?(timeLeft>=10?3:timeLeft>=5?2:1):0;
  const myIdx=amIP1?0:1;
  scores[myIdx]+=pts;
  document.getElementById(`sc${myIdx+1}-pts`).textContent=scores[myIdx];

  btns.forEach(b=>b.classList.add('locked'));
  btns[q.ans].classList.add('correct');
  if(!correct) btns[idx].classList.add('wrong');
  document.getElementById('feedback').style.color=correct?'#34d399':'#f87171';
  document.getElementById('feedback').textContent=correct?`вњ… To'g'ri! +${pts} ball`:'вќЊ Noto\'g\'ri!';

  if(!isSolo){
    const myRole=amIP1?'p1':'p2';
    sendState('quiz', roomCode, {
      qIndex, [`${myRole}Answered`]:idx, [`${myRole}Score`]:scores[myIdx]
    });
    if(oppAnswered!==null) advanceAfterBoth();
    else document.getElementById('opp-status').textContent='вЏі Raqib javob bermoqda...';
  } else {
    // Solo: CPU answers shortly after
    if(activeTurn===0){
      if(oppAnswered===null){
        const cpuPick=Math.random()<.7?q.ans:Math.floor(Math.random()*4);
        setTimeout(()=>cpuAnswer(cpuPick), 800+Math.random()*1200);
      }
    } else {
      advanceSolo();
    }
  }
}

function cpuAnswer(idx){
  oppAnswered=idx;
  const q=questions[qIndex];
  const correct=idx===q.ans;
  const pts=correct?2:0;
  scores[1]+=pts;
  document.getElementById('sc2-pts').textContent=scores[1];
  showOppFeedback(idx);
  if(myAnswered!==null) advanceSolo();
}

function showOppFeedback(idx){
  const q=questions[qIndex];
  const btns=document.querySelectorAll('.ans-btn');
  if(btns[idx]) btns[idx].classList.add('opponent-answered');
  const oppName=amIP1?p2User.username:p1User.username;
  document.getElementById('opp-status').textContent=
    idx===q.ans?`вњ… ${oppName} to'g'ri javob berdi!`:`вќЊ ${oppName} noto'g'ri javob berdi`;
}

function advanceSolo(){
  setTimeout(()=>{
    qIndex++;
    activeTurn=activeTurn===0?1:0;
    myAnswered=null; oppAnswered=null;
    showQuestion();
  },1500);
}

function advanceAfterBoth(){
  document.getElementById('opp-status').textContent='';
  setTimeout(()=>{
    qIndex++;
    myAnswered=null; oppAnswered=null;
    if(!isSolo&&amIP1) sendState('quiz', roomCode, {qIndex});
    showQuestion();
  },1600);
}

function timeUp(){
  myAnswered=-1;
  document.querySelectorAll('.ans-btn').forEach(b=>b.classList.add('locked'));
  document.querySelectorAll('.ans-btn')[questions[qIndex].ans].classList.add('correct');
  document.getElementById('feedback').style.color='#f87171';
  document.getElementById('feedback').textContent='вЏ° Vaqt tugadi!';
  if(!isSolo){
    const myRole=amIP1?'p1':'p2';
    sendState('quiz', roomCode, {qIndex,[`${myRole}Answered`]:-1});
    if(oppAnswered!==null) advanceAfterBoth();
    else document.getElementById('opp-status').textContent='вЏі Raqib javob bermoqda...';
  } else {
    setTimeout(()=>cpuAnswer(Math.floor(Math.random()*4)),600);
  }
}

function updateTimer(t,max){
  const circ=175.9, offset=circ*(1-t/max);
  document.getElementById('timer-arc').style.strokeDashoffset=offset;
  document.getElementById('timer-text').textContent=t;
  if(t>5){
    document.getElementById('timer-arc').style.stroke='#10b981';
    document.getElementById('timer-text').style.color='#fff';
  }
}

function endGame(){
  clearInterval(timerInt);
  if(_roomUnsub)_roomUnsub();
  const[s1,s2]=scores;
  let emoji,title,sub,coinsText='';
  document.getElementById('rs-s1').textContent=s1;
  document.getElementById('rs-s2').textContent=s2;

  if(s1===s2){
    emoji='рџ¤ќ';title='Durang!';sub='Ikki o\'yinchi teng ball to\'pladi!';
    if(!isSolo)finishRoom('quiz',roomCode,'draw');
  } else {
    const winner=s1>s2?0:1;
    const iWon=(winner===0&&amIP1)||(winner===1&&!amIP1)||(isSolo&&winner===0);
    const winName=winner===0?p1User.username:p2User.username;
    if(iWon||(isSolo&&winner===0)){
      emoji='рџЏ†';title='G\'OLIBSIZ!';sub=`${winName} yutdi: ${s1} vs ${s2}`;
      coinsText=`+рџЄ™ ${reward} tanga!`;
      addCoins(reward);addResult(true);
      document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
      if(!isSolo)finishRoom('quiz',roomCode,winner===0?p1Key:p2Key);
    } else {
      emoji='рџў';title='Yutqazdingiz';sub=`${winName} yutdi: ${Math.max(s1,s2)} vs ${Math.min(s1,s2)}`;
      addResult(false);
      if(!isSolo)finishRoom('quiz',roomCode,winner===0?p1Key:p2Key);
    }
  }
  document.getElementById('res-emoji').textContent=emoji;
  document.getElementById('res-title').textContent=title;
  document.getElementById('res-sub').textContent=sub;
  document.getElementById('res-coins').textContent=coinsText;
  document.getElementById('result-overlay').classList.add('show');
  refreshCoinDisplay();
}

function goHome(){if(_roomUnsub)_roomUnsub();window.location.href='dashboard.html';}
</script>
