<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}
    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
    .stats-bar{display:flex;gap:20px;margin-bottom:16px;}
    .stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 18px;text-align:center;}
    .stat-label{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;}
    .stat-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:#10b981;}
    canvas{border:2px solid rgba(16,185,129,.3);border-radius:12px;background:#0d1117;box-shadow:0 0 40px rgba(16,185,129,.1);}
    .controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
    .ctrl-btn{padding:10px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .btn-play{background:linear-gradient(135deg,#10b981,#059669);}
    .btn-play:hover{transform:translateY(-2px);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    /* D-pad for mobile */
    .dpad{display:none;flex-direction:column;align-items:center;gap:4px;margin-top:14px;}
    .dpad-row{display:flex;gap:4px;}
    .dpad-btn{width:52px;height:52px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .dpad-btn:active{background:rgba(16,185,129,.3);}
    @media(max-width:600px){.dpad{display:flex;}canvas{width:min(340px,90vw);height:min(340px,90vw);}}
    /* Overlay */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:200;}
    .overlay-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:320px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .ov-emoji{font-size:64px;display:block;margin-bottom:12px;}
    .ov-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
    .ov-score{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;color:#10b981;margin-bottom:6px;}
    .ov-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:6px;}
    .ov-coins{color:#fbbf24;font-size:16px;font-weight:700;margin-bottom:20px;}
    .ov-btns{display:flex;gap:10px;justify-content:center;}
    .ov-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .ov-play{background:linear-gradient(135deg,#10b981,#059669);}
    .ov-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  </style>
</head>
<body>
<nav class="navbar">
  <button class="back-btn" onclick="goHome()">← Orqaga</button>
  <div class="nav-logo">🐍 Snake</div>
  <div class="coin-display">🪙 <span id="nav-coins">0</span></div>
</nav>
<div class="game-wrap">
  <h1 class="game-title">SNAKE</h1>
  <div class="stats-bar">
    <div class="stat"><div class="stat-label">Ball</div><div class="stat-val" id="score">0</div></div>
    <div class="stat"><div class="stat-label">Rekord</div><div class="stat-val" id="best">0</div></div>
    <div class="stat"><div class="stat-label">Daraja</div><div class="stat-val" id="level">1</div></div>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="controls">
    <button class="ctrl-btn btn-play" id="start-btn" onclick="startGame()">▶ Boshlash</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">🏠 Uy</button>
  </div>
  <div class="dpad">
    <div class="dpad-row"><button class="dpad-btn" onclick="setDir(0,-1)">▲</button></div>
    <div class="dpad-row">
      <button class="dpad-btn" onclick="setDir(-1,0)">◀</button>
      <button class="dpad-btn" style="opacity:.3;cursor:default">●</button>
      <button class="dpad-btn" onclick="setDir(1,0)">▶</button>
    </div>
    <div class="dpad-row"><button class="dpad-btn" onclick="setDir(0,1)">▼</button></div>
  </div>
</div>
<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <span class="ov-emoji" id="ov-emoji">🐍</span>
    <div class="ov-title" id="ov-title">Snake O'yini</div>
    <div class="ov-score" id="ov-score">0</div>
    <div class="ov-sub" id="ov-sub">O'yinni boshlash uchun tugmani bosing</div>
    <div class="ov-coins" id="ov-coins"></div>
    <div class="ov-btns">
      <button class="ov-btn ov-play" onclick="startGame()">▶ Boshlash</button>
      <button class="ov-btn ov-home" onclick="goHome()">🏠 Uy</button>
    </div>
  </div>
</div>
<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
const COLS=20,ROWS=20,CELL=20;
let snake,dir,nextDir,food,score,level,gameLoop,running=false;
let best=parseInt(localStorage.getItem('gz_snake_best')||'0');

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('best').textContent=best;
  drawIdle();
  document.addEventListener('keydown',e=>{
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if(map[e.key]){e.preventDefault();const d=map[e.key];setDir(d[0],d[1]);}
    if(e.key===' '&&!running) startGame();
  });
});

function setDir(x,y){
  if(!running) return;
  if(x===dir[0]*-1&&y===dir[1]*-1) return; // reverse
  nextDir=[x,y];
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  snake=[[10,10],[9,10],[8,10]];
  dir=[1,0]; nextDir=[1,0];
  score=0; level=1;
  spawnFood();
  updateStats();
  running=true;
  clearInterval(gameLoop);
  gameLoop=setInterval(tick,150);
}

function tick(){
  dir=nextDir;
  const head=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
  // wall collision
  if(head[0]<0||head[0]>=COLS||head[1]<0||head[1]>=ROWS){endGame();return;}
  // self collision
  if(snake.some(s=>s[0]===head[0]&&s[1]===head[1])){endGame();return;}
  snake.unshift(head);
  if(head[0]===food[0]&&head[1]===food[1]){
    score+=10*level;
    if(score%(50*level)===0){level++;clearInterval(gameLoop);gameLoop=setInterval(tick,Math.max(60,150-level*15));}
    spawnFood();
  } else { snake.pop(); }
  updateStats(); draw();
}

function spawnFood(){
  do{ food=[Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS)];
  }while(snake.some(s=>s[0]===food[0]&&s[1]===food[1]));
}

function draw(){
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid dots
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) ctx.fillRect(x*CELL+9,y*CELL+9,2,2);
  // food
  ctx.fillStyle='#ef4444';
  ctx.beginPath(); ctx.arc(food[0]*CELL+CELL/2,food[1]*CELL+CELL/2,CELL/2-2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.arc(food[0]*CELL+CELL/2-3,food[1]*CELL+CELL/2-3,3,0,Math.PI*2); ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    const ratio=1-i/snake.length;
    ctx.fillStyle=`rgba(16,185,129,${0.4+ratio*0.6})`;
    const pad=i===0?1:2;
    ctx.beginPath();
    ctx.roundRect(s[0]*CELL+pad,s[1]*CELL+pad,CELL-pad*2,CELL-pad*2,i===0?6:4);
    ctx.fill();
  });
  // eyes on head
  if(snake.length){
    const hx=snake[0][0]*CELL,hy=snake[0][1]*CELL;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(hx+6,hy+6,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hx+14,hy+6,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(hx+7,hy+7,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hx+15,hy+7,1.5,0,Math.PI*2);ctx.fill();
  }
}

function drawIdle(){
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(16,185,129,.3)';
  ctx.font='bold 18px Orbitron,monospace';
  ctx.textAlign='center';
  ctx.fillText('SPACE yoki ▶ bosing',canvas.width/2,canvas.height/2);
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  if(score>best){best=score;localStorage.setItem('gz_snake_best',best);document.getElementById('best').textContent=best;}
}

function endGame(){
  clearInterval(gameLoop); running=false;
  const pts=Math.floor(score/5);
  if(pts>0){addCoins(pts);}
  addResult(score>50);
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('ov-emoji').textContent=score>50?'🏆':'😢';
  document.getElementById('ov-title').textContent=score>50?'Zo\'r natija!':'O\'yin tugadi';
  document.getElementById('ov-score').textContent=score;
  document.getElementById('ov-sub').textContent=`Uzunlik: ${snake.length} | Daraja: ${level}`;
  document.getElementById('ov-coins').textContent=pts>0?`+🪙 ${pts} tanga!`:'';
  document.getElementById('overlay').style.display='flex';
}
function goHome(){window.location.href='dashboard.html';}
</script>
</body>
</html>
