<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Math Duel</title>
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}
    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
    /* Score */
    .score-bar{display:flex;align-items:center;gap:20px;margin-bottom:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 28px;width:100%;max-width:500px;}
    .sc-card{flex:1;text-align:center;}
    .sc-name{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:4px;}
    .sc-pts{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:#f59e0b;}
    .sc-div{font-family:'Orbitron',sans-serif;font-size:13px;color:rgba(255,255,255,.2);}
    /* Timer ring */
    .timer-wrap{position:relative;width:68px;height:68px;margin:0 auto 16px;}
    .timer-wrap svg{transform:rotate(-90deg);}
    circle{fill:none;stroke-width:5;stroke-linecap:round;}
    .t-bg{stroke:rgba(255,255,255,.08);}
    .t-fg{stroke:#f59e0b;transition:stroke-dashoffset .95s linear,stroke .3s;}
    .timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;}
    /* Question */
    .question-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 32px;text-align:center;margin-bottom:20px;width:100%;max-width:500px;}
    .q-num{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
    .q-expr{font-family:'Orbitron',sans-serif;font-size:clamp(28px,6vw,44px);font-weight:900;color:#fff;letter-spacing:2px;}
    /* Answers */
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:500px;margin-bottom:14px;}
    .ans-btn{padding:16px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;cursor:pointer;transition:.2s;}
    .ans-btn:hover:not(.locked){background:rgba(245,158,11,.15);border-color:#f59e0b;transform:translateY(-2px);}
    .ans-btn.correct{background:rgba(16,185,129,.25)!important;border-color:#10b981!important;}
    .ans-btn.wrong{background:rgba(239,68,68,.2)!important;border-color:#ef4444!important;}
    .ans-btn.locked{cursor:default;}
    .feedback{font-size:16px;font-weight:700;text-align:center;min-height:24px;margin-bottom:4px;}
    /* Progress */
    .progress-bar{width:100%;max-width:500px;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:16px;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);transition:width .4s;}
    .controls{display:flex;gap:10px;}
    .ctrl-btn{padding:10px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .btn-play{background:linear-gradient(135deg,#f59e0b,#ef4444);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;}
    .result-overlay.show{display:flex;}
    .result-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .res-emoji{font-size:64px;display:block;margin-bottom:12px;}
    .res-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
    .res-scores{display:flex;gap:24px;justify-content:center;margin-bottom:10px;}
    .rs-name{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:4px;}
    .rs-score{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;}
    .res-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:6px;}
    .res-coins{color:#fbbf24;font-size:16px;font-weight:700;margin-bottom:20px;}
    .res-btns{display:flex;gap:10px;justify-content:center;}
    .res-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
    .res-play{background:linear-gradient(135deg,#f59e0b,#ef4444);}
    .res-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  </style>
</head>
<body>
<nav class="navbar">
  <button class="back-btn" onclick="goHome()">← Orqaga</button>
  <div class="nav-logo">🧮 Math Duel</div>
  <div class="coin-display">🪙 <span id="nav-coins">0</span></div>
</nav>
<div class="game-wrap">
  <h1 class="game-title">MATH DUEL</h1>
  <div class="score-bar">
    <div class="sc-card"><div class="sc-name" id="p1-name">Siz</div><div class="sc-pts" id="p1-sc">0</div></div>
    <div class="sc-div">VS</div>
    <div class="sc-card"><div class="sc-name" id="p2-name">CPU</div><div class="sc-pts" id="p2-sc">0</div></div>
  </div>
  <div class="timer-wrap">
    <svg width="68" height="68" viewBox="0 0 68 68">
      <circle class="t-bg" cx="34" cy="34" r="29"/>
      <circle class="t-fg" id="t-arc" cx="34" cy="34" r="29" stroke-dasharray="182.2" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text" id="t-txt">10</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="question-box">
    <div class="q-num" id="q-num">Savol 1 / 10</div>
    <div class="q-expr" id="q-expr">? + ? = ?</div>
  </div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="ctrl-btn btn-play" onclick="startGame()">🔄 Qayta</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">🏠 Uy</button>
  </div>
</div>
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="res-emoji" id="res-emoji">🏆</span>
    <div class="res-title" id="res-title"></div>
    <div class="res-scores">
      <div><div class="rs-name" id="rs-n1">Siz</div><div class="rs-score" id="rs-s1">0</div></div>
      <div><div class="rs-name" id="rs-n2">CPU</div><div class="rs-score" id="rs-s2">0</div></div>
    </div>
    <div class="res-sub" id="res-sub"></div>
    <div class="res-coins" id="res-coins"></div>
    <div class="res-btns">
      <button class="res-btn res-play" onclick="startGame()">🔄 Qayta</button>
      <button class="res-btn res-home" onclick="goHome()">🏠 Uy</button>
    </div>
  </div>
</div>
<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
const TOTAL=10, TIME=10;
let qIdx, p1Score, p2Score, questions, timerInt, timeLeft, answered;

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('p1-name').textContent=getCurrentUser()?.username||'Siz';
  document.getElementById('rs-n1').textContent=getCurrentUser()?.username||'Siz';
  startGame();
});

function genQuestion(idx){
  const ops=['+','-','×','÷'];
  let op,a,b,ans;
  const diff=Math.min(3,Math.floor(idx/3));
  if(diff===0){op=ops[Math.floor(Math.random()*2)];a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*20)+1;}
  else if(diff===1){op=ops[Math.floor(Math.random()*3)];a=Math.floor(Math.random()*50)+10;b=Math.floor(Math.random()*20)+1;}
  else{op=ops[Math.floor(Math.random()*4)];a=Math.floor(Math.random()*100)+10;b=Math.floor(Math.random()*20)+1;}
  if(op==='÷'){b=Math.floor(Math.random()*10)+2;a=b*(Math.floor(Math.random()*15)+1);}
  if(op==='×'){a=Math.floor(Math.random()*20)+2;b=Math.floor(Math.random()*20)+2;}
  if(op==='+') ans=a+b;
  else if(op==='-') ans=a-b;
  else if(op==='×') ans=a*b;
  else ans=a/b;
  // Wrong options
  const wrongs=new Set();
  while(wrongs.size<3){
    const w=ans+Math.floor(Math.random()*20)-10;
    if(w!==ans&&w!==0) wrongs.add(w);
  }
  const opts=[ans,...wrongs].sort(()=>Math.random()-.5);
  return{expr:`${a} ${op} ${b} = ?`,ans,opts};
}

function startGame(){
  qIdx=0;p1Score=0;p2Score=0;answered=false;
  questions=Array.from({length:TOTAL},(_,i)=>genQuestion(i));
  document.getElementById('p1-sc').textContent='0';
  document.getElementById('p2-sc').textContent='0';
  document.getElementById('result-overlay').classList.remove('show');
  showQuestion();
}

function showQuestion(){
  if(qIdx>=TOTAL){endGame();return;}
  answered=false;
  clearInterval(timerInt);
  const q=questions[qIdx];
  document.getElementById('q-num').textContent=`Savol ${qIdx+1} / ${TOTAL}`;
  document.getElementById('q-expr').textContent=q.expr;
  document.getElementById('prog').style.width=`${(qIdx/TOTAL)*100}%`;
  document.getElementById('feedback').textContent='';

  const wrap=document.getElementById('answers');
  wrap.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.textContent=opt;
    btn.onclick=()=>answer(opt,q.ans,btn);
    wrap.appendChild(btn);
  });

  timeLeft=TIME; updateTimer(timeLeft,TIME);
  timerInt=setInterval(()=>{
    timeLeft--;updateTimer(timeLeft,TIME);
    if(timeLeft<=3){document.getElementById('t-arc').style.stroke='#ef4444';document.getElementById('t-txt').style.color='#ef4444';}
    if(timeLeft<=0){clearInterval(timerInt);if(!answered)timeUp();}
  },1000);

  // CPU answers (smart: right 65% of time, faster on later questions)
  const cpuDelay=Math.max(500,3000-qIdx*200)*( Math.random()*0.5+0.75);
  setTimeout(()=>{
    if(!answered) return; // player already answered
    // CPU mark
    const cpuRight=Math.random()<0.65;
    const cpuAns=cpuRight?q.ans:q.opts.find(o=>o!==q.ans);
    if(cpuAns!==undefined){
      if(cpuRight) p2Score++;
      document.getElementById('p2-sc').textContent=p2Score;
    }
  },cpuDelay);
}

function answer(val,correct,btn){
  if(answered) return;
  answered=true;
  clearInterval(timerInt);
  document.querySelectorAll('.ans-btn').forEach(b=>{b.classList.add('locked');if(parseInt(b.textContent)===correct)b.classList.add('correct');});
  const pts=val===correct?Math.max(1,Math.ceil(timeLeft/3)):0;
  if(val===correct){
    p1Score+=pts;btn.classList.add('correct');
    document.getElementById('feedback').style.color='#34d399';
    document.getElementById('feedback').textContent=`✅ To'g'ri! +${pts} ball`;
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').style.color='#f87171';
    document.getElementById('feedback').textContent='❌ Noto\'g\'ri!';
    // CPU more likely right
    if(Math.random()<0.8){p2Score++;document.getElementById('p2-sc').textContent=p2Score;}
  }
  document.getElementById('p1-sc').textContent=p1Score;
  setTimeout(()=>{qIdx++;showQuestion();},1200);
}

function timeUp(){
  answered=true;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.classList.add('locked');if(parseInt(b.textContent)===questions[qIdx].ans)b.classList.add('correct');});
  document.getElementById('feedback').style.color='#f87171';
  document.getElementById('feedback').textContent='⏰ Vaqt tugadi!';
  p2Score++;document.getElementById('p2-sc').textContent=p2Score;
  setTimeout(()=>{qIdx++;showQuestion();},1000);
}

function updateTimer(t,max){
  const circ=182.2,offset=circ*(1-t/max);
  document.getElementById('t-arc').style.strokeDashoffset=offset;
  document.getElementById('t-txt').textContent=t;
  if(t>3){document.getElementById('t-arc').style.stroke='#f59e0b';document.getElementById('t-txt').style.color='#fff';}
}

function endGame(){
  clearInterval(timerInt);
  const won=p1Score>p2Score;
  const pts=won?80:0;
  if(pts>0){addCoins(pts);addResult(true);}else if(p1Score<p2Score)addResult(false);
  document.getElementById('nav-coins').textContent=getCurrentUser()?.coins||0;
  document.getElementById('res-emoji').textContent=won?'🏆':p1Score===p2Score?'🤝':'😢';
  document.getElementById('res-title').textContent=won?'G\'OLIBSIZ!':p1Score===p2Score?'Durang!':'Yutqazdingiz';
  document.getElementById('rs-s1').textContent=p1Score;
  document.getElementById('rs-s2').textContent=p2Score;
  document.getElementById('res-sub').textContent=won?'Matematika ustasisiz!':'Mashq qiling!';
  document.getElementById('res-coins').textContent=pts>0?`+🪙 ${pts} tanga!`:'';
  document.getElementById('result-overlay').classList.add('show');
}
function goHome(){window.location.href='dashboard.html';}
</script>
</body>
</html>
