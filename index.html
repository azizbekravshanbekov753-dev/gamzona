<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Mini O'yinlar</title>
  <link rel="stylesheet" href="auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg-animation">
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div>
  </div>

  <div class="auth-container">
    <div class="logo-area">
      <div class="logo-icon">🎮</div>
      <h1 class="logo-text">GameZone</h1>
      <p class="logo-sub">Mini O'yinlar Platformasi</p>
    </div>

    <!-- Tab buttons -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showTab('login')">Kirish</button>
      <button class="tab-btn" onclick="showTab('register')">Ro'yxatdan O'tish</button>
    </div>

    <!-- Login Form -->
    <div id="login-tab" class="tab-content active">
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="login-username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" placeholder="Parol" required />
          <button type="button" class="eye-btn" onclick="togglePass('login-password', this)">👁️</button>
        </div>
        <div id="login-error" class="error-msg"></div>
        <button type="submit" class="auth-btn">
          <span>Kirish</span>
          <div class="btn-glow"></div>
        </button>
      </form>
      <p class="switch-text">Akkauntingiz yo'qmi? <a href="#" onclick="showTab('register')">Ro'yxatdan o'ting</a></p>
    </div>

    <!-- Register Form -->
    <div id="register-tab" class="tab-content">
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="reg-username" placeholder="Username (3-16 belgi)" required minlength="3" maxlength="16"/>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="reg-password" placeholder="Parol (kamida 6 belgi)" required minlength="6"/>
          <button type="button" class="eye-btn" onclick="togglePass('reg-password', this)">👁️</button>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="reg-confirm" placeholder="Parolni takrorlang" required minlength="6"/>
          <button type="button" class="eye-btn" onclick="togglePass('reg-confirm', this)">👁️</button>
        </div>
        <div id="reg-error" class="error-msg"></div>
        <div id="reg-success" class="success-msg"></div>
        <button type="submit" class="auth-btn register-btn">
          <span>Ro'yxatdan O'tish</span>
          <div class="btn-glow"></div>
        </button>
      </form>
      <p class="switch-text">Allaqachon akkauntingiz bormi? <a href="#" onclick="showTab('login')">Kiring</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
